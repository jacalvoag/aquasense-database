name: aquasense
x-conexion: &conexion
  PGHOST: postgres
  PGPORT: 5432
  PGDATABASE: aquasense
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD:-aquasense-local-postgres}
  MONGODB_URI: mongodb://mongodb:27017
  MONGODB_DATABASE: aquasense
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aquasense-local-neo4j}
  NEO4J_DATABASE: neo4j
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: aquasense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquasense-local-postgres}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d aquasense]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  mongodb:
    image: mongo:8.0.38
    volumes: [mongodb:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26.34-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aquasense-local-neo4j}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes: [neo4j:/data]
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1"']
      interval: 5s
      timeout: 10s
      retries: 40
    restart: unless-stopped
  inicializar:
    build:
      context: .
      dockerfile: docker/sincronizador.Dockerfile
    image: aquasense-sincronizador:local
    environment: *conexion
    user: root
    command: [node, --import, tsx, inicializar.ts]
    volumes: [inicializacion:/estado]
    depends_on:
      postgres: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      neo4j: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *conexion
      HOST: 0.0.0.0
      PORT: 3000
      API_OPERATOR_USER: ${API_OPERATOR_USER:-operador}
      API_OPERATOR_PASSWORD: ${API_OPERATOR_PASSWORD:-aquasense-operador-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    depends_on:
      inicializar: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "Promise.all(['postgres','mongodb','neo4j'].map(x=>fetch('http://127.0.0.1:3000/salud/'+x).then(r=>{if(!r.ok)throw Error(x)}))).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  sincronizador:
    image: aquasense-sincronizador:local
    build:
      context: .
      dockerfile: docker/sincronizador.Dockerfile
    environment: *conexion
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:3000}
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  postgres:
  mongodb:
  neo4j:
  inicializacion:
